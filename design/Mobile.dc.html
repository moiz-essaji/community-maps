<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0E2B49; text-decoration: none; }
    a:hover { color: #C9A227; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF7EC; font-family: Jost, 'Segoe UI', system-ui, sans-serif; color: #1F2933; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- header -->
  <div style="height: 58px; background: #0E2B49; display: flex; align-items: center; gap: 11px; padding: 0 14px; flex-shrink: 0;">
    <svg width="34" height="34" viewBox="0 0 66 66" fill="none" aria-hidden="true">
      <circle cx="33" cy="33" r="30" stroke="#E8C061" stroke-width="1.6"/>
      <path d="M33 9 L38 26 L55 31 L38 36 L33 53 L28 36 L11 31 L28 26 Z" stroke="#E8C061" stroke-width="1.6" fill="none"/>
      <circle cx="33" cy="33" r="4" fill="#E8C061"/>
    </svg>
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
      <span style="font-family: Marcellus, Georgia, serif; font-size: 15px; letter-spacing: 1.1px; color: #E8C061;">Bohra Masjid Finder</span>
      <span style="font-size: 11px; color: #B9C6D4; font-weight: 300;">Dawoodi Bohra masjids across India</span>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#E8C061" stroke-width="1.9"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </div>
  </div>

  <!-- search -->
  <div style="padding: 12px 14px 10px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 10px; height: 46px; border: 1px solid #DED7C4; border-radius: 9px; padding: 0 13px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(14,43,73,0.06);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B94A0" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
      <span style="color: #98A1AC; font-size: 15px; font-weight: 300;">Search masjid, city or state…</span>
    </div>
  </div>

  <!-- map -->
  <div style="margin: 0 14px; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 10px rgba(14,43,73,0.09); flex-shrink: 0; background: #FFFFFF;">
    <div style="position: relative; height: 44px; background: #0E2B49; display: flex; align-items: center; padding: 0 14px; overflow: hidden;">
      <svg width="160" height="44" viewBox="0 0 160 44" fill="none" style="position: absolute; right: 0; top: 0; opacity: 0.17;" aria-hidden="true">
        <defs><pattern id="arabM" width="34" height="34" patternUnits="userSpaceOnUse">
          <path d="M17 3 L20.5 13.5 L31 17 L20.5 20.5 L17 31 L13.5 20.5 L3 17 L13.5 13.5 Z" fill="none" stroke="#E8C061" stroke-width="0.9"/>
        </pattern></defs>
        <rect width="160" height="44" fill="url(#arabM)"/>
      </svg>
      <h2 style="margin: 0; font-family: Marcellus, Georgia, serif; font-size: 13px; letter-spacing: 2.2px; color: #E8C061; text-transform: uppercase; position: relative;">Masjid Map</h2>
    </div>
    <div style="position: relative; height: 268px; background: #EDF0EA; overflow: hidden;">
      <svg width="100%" height="100%" viewBox="0 0 362 268" preserveAspectRatio="xMidYMid slice" style="display: block;" aria-hidden="true">
        <rect width="362" height="268" fill="#EDF0EA"/>
        <path d="M0 190 C70 172 120 208 190 194 C250 182 300 210 362 198 L362 268 L0 268 Z" fill="#D9E7EE"/>
        <g fill="#E3EBDC">
          <ellipse cx="86" cy="70" rx="46" ry="30"/>
          <ellipse cx="278" cy="112" rx="40" ry="26"/>
        </g>
        <g stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round">
          <path d="M-10 104 L372 92"/><path d="M-10 158 L372 150"/>
          <path d="M108 -10 L120 278"/><path d="M240 -10 L228 278"/>
        </g>
        <g stroke="#F6F8F4" stroke-width="2.5" fill="none">
          <path d="M-10 52 L372 44"/><path d="M-10 218 L372 228"/><path d="M180 -10 L176 278"/>
        </g>
      </svg>
      <div style="position: absolute; inset: 0;">
        <svg width="100%" height="100%" viewBox="0 0 362 268" preserveAspectRatio="xMidYMid slice" style="display: block;" aria-hidden="true">
          <path d="M100 120 C100 110 107 104 114 104 C121 104 128 110 128 120 C128 131 114 149 114 149 C114 149 100 131 100 120 Z" fill="#0E2B49"/>
          <circle cx="114" cy="119" r="4.6" fill="#E8C061"/>
          <path d="M212 82 C212 72 219 66 226 66 C233 66 240 72 240 82 C240 93 226 111 226 111 C226 111 212 93 212 82 Z" fill="#0E2B49"/>
          <circle cx="226" cy="81" r="4.6" fill="#E8C061"/>
          <path d="M164 186 C164 176 171 170 178 170 C185 170 192 176 192 186 C192 197 178 215 178 215 C178 215 164 197 164 186 Z" fill="#5D6B7A"/>
          <circle cx="178" cy="185" r="4.6" fill="#FFFFFF"/>
          <path d="M292 158 C292 148 299 142 306 142 C313 142 320 148 320 158 C320 169 306 187 306 187 C306 187 292 169 292 158 Z" fill="#0E2B49"/>
          <circle cx="306" cy="157" r="4.6" fill="#E8C061"/>
        </svg>
      </div>
      <div style="position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,0.88); padding: 3px 7px; font-size: 9px; color: #5C6672; font-weight: 300;">© OpenStreetMap — <span style="color: #0E2B49; text-decoration: underline;">disclaimer</span></div>
    </div>
  </div>

  <!-- directory -->
  <div style="flex: 1; margin: 14px 14px 0; background: #FFFFFF; border-radius: 10px 10px 0 0; box-shadow: 0 -1px 10px rgba(14,43,73,0.08); display: flex; flex-direction: column; overflow: hidden; min-height: 0;">
    <div style="position: relative; height: 44px; background: #0E2B49; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; overflow: hidden; flex-shrink: 0;">
      <svg width="160" height="44" viewBox="0 0 160 44" fill="none" style="position: absolute; right: 0; top: 0; opacity: 0.17;" aria-hidden="true">
        <defs><pattern id="arabN" width="34" height="34" patternUnits="userSpaceOnUse">
          <path d="M17 3 L20.5 13.5 L31 17 L20.5 20.5 L17 31 L13.5 20.5 L3 17 L13.5 13.5 Z" fill="none" stroke="#E8C061" stroke-width="0.9"/>
        </pattern></defs>
        <rect width="160" height="44" fill="url(#arabN)"/>
      </svg>
      <h2 style="margin: 0; font-family: Marcellus, Georgia, serif; font-size: 13px; letter-spacing: 2.2px; color: #E8C061; text-transform: uppercase; position: relative;">Nearest to You</h2>
      <span style="font-size: 11px; color: #B9C6D4; font-weight: 300; position: relative;">27 listed</span>
    </div>

    <div style="padding: 12px 14px; border-bottom: 1px solid #F2EEE2; border-left: 3px solid #E8C061; background: #FEFCF5; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 15.5px; font-weight: 500; color: #12283F;">Gurratul Masajid</span>
        <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #14603F; background: #DFF0E6; padding: 2px 6px; border-radius: 3px;">Verified</span>
      </div>
      <span style="font-size: 12.5px; color: #6B7682; font-weight: 300;">Bhendi Bazaar, Mumbai · <span style="color: #14603F; font-weight: 500;">1.2 km away</span></span>
      <div style="display: flex; gap: 8px; margin-top: 3px;">
        <span style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; background: #0E2B49; color: #FFFFFF; border-radius: 6px; font-size: 12.5px; font-weight: 500;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E8C061" stroke-width="2"><path d="M3 11l18-8-8 18-2-8-8-2Z"/></svg>Navigate</span>
        <span style="display: flex; align-items: center; height: 34px; padding: 0 14px; border: 1px solid #DED7C4; color: #6B7682; border-radius: 6px; font-size: 12.5px;">Report</span>
      </div>
    </div>

    <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 15.5px; font-weight: 500; color: #12283F;">Al-Masjid Al-Moazzam</span>
        <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #14603F; background: #DFF0E6; padding: 2px 6px; border-radius: 3px;">Verified</span>
      </div>
      <span style="font-size: 12.5px; color: #6B7682; font-weight: 300;">Zampa Bazaar, Surat · <span style="color: #14603F; font-weight: 500;">248 km away</span></span>
    </div>
  </div>

  <!-- floating control -->
  <div style="position: absolute; right: 14px; bottom: 18px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; background: #0E2B49; border-radius: 23px; box-shadow: 0 5px 15px rgba(14,43,73,0.34);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8C061" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span style="color: #FFFFFF; font-size: 14.5px; font-weight: 500;">Add</span>
  </div>
</div>
</x-dc>
</body>
</html>
